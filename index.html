<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MEE Insight Hub：统一组织 MEE 自进化、个人洞察、产品商机、新闻热点与参考数据来源的公开情报站。" />
    <title>MEE Insight Hub</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="reading-progress" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="MEE Insight Hub">
        <span class="brand-mark">M</span>
        <span>MEE Insight Hub</span>
      </a>
      <nav class="site-nav" aria-label="站点导航">
        <a href="#reports">报告中心</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero section-band">
        <div class="hero-copy">
          <h1 id="hero-title">公开情报与私域收藏洞察中枢</h1>
          <p id="hero-thesis" class="hero-lead">这里汇总每日、每周、每月的新闻热点、个人洞察、产品机会、MEE 自进化和参考来源；先读报告正文，再按证据簇追溯来源。</p>
          <div class="hero-actions" aria-label="核心入口">
            <a class="primary-link" href="#reports">查看报告中心</a>
          </div>
        </div>
        <aside class="signal-panel" aria-label="阅读顺序">
          <h2>阅读顺序</h2>
          <div id="hero-metrics" class="metric-grid"></div>
          <p id="hero-summary">正在加载最新站点数据。</p>
        </aside>
      </section>

      <section id="reports" class="section report-section">
        <div class="section-heading">
          <span>01</span>
          <div>
            <h2>报告中心：日报、周报、月报</h2>
            <p>本站点的核心是报告主体内容。先按时间周期选择日报、周报或月报，再进入 MEE、个人、产品、新闻和来源五类报告正文。</p>
          </div>
        </div>
        <div id="report-pack-tabs" class="report-pack-tabs" role="tablist" aria-label="报告周期"></div>
        <div id="report-pack-summary" class="report-pack-summary"></div>
        <div id="report-overview" class="report-overview" aria-label="本周期报告目录"></div>
        <div id="report-tabs" class="report-tabs" role="tablist" aria-label="报告类型"></div>
        <div id="report-detail" class="report-detail"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>MEE Insight Hub</span>
      <span>GitHub Pages first · Vercel and Feishu opt-in</span>
    </footer>

    <div class="lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="图片预览" aria-hidden="true">
      <button class="lightbox-close" type="button">关闭</button>
      <img alt="" />
    </div>

    <script src="./script.js"></script>
  </body>
</html>
